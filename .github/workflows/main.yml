name : Postman Collection Workflow
on: 
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 30 02 * * * 
    - cron: 00 14 * * *
    - cron: 00 06 * * 1-5
jobs:
  run-postman-tests:
    runs-on: ec2-github-runner

    steps:
      - name: checkout code
        uses: actions/checkout@v6.1.0

      - name: install Nodejs and npm
        uses: actions/setup-node@v6.5.0
        with: 
         node-version: '24'

      - name: install newman and htmlextra globally
        run: |
            npm install -g newman 
            npm install -g newman-reporter-htmlextra

      - name: Run the postman collection with newman
        run: |
            newman run 'Inwarranty-flow Collection-Jathin.postman_collection.json' \
            -e QA.postman_environment.json \
            -d testData.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./newman/index.html

      - name: Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Newman Report
          path: newman/*.html

      - name: Creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/
          
      - name: send Email notification
        if: always()
        uses: dawidd6/action-send-mail@v20
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix inwarranty flow collection test execution
          to: t.manasark@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
              Hi,
              Phoenix inwarranty flow collection has been executed and the report has been
              published and the URL : https://manasa994.github.io/Phoenix_Inwarranty_Flow/
        
        
  
  
